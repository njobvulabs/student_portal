{% extends 'base.html' %}

{% block title %}Reset Email Sent - Student Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-success text-white text-center py-4">
                    <h3 class="mb-0">Check Your Email</h3>
                </div>
                <div class="card-body p-4 text-center">
                    <i class="fas fa-envelope-open-text text-success display-3 mb-3"></i>
                    <p class="mb-0">If an account with that email exists, we've sent password reset instructions.</p>
                </div>
                <div class="card-footer bg-light text-center py-3">
                    <a href="{% url 'login' %}" class="text-primary">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
