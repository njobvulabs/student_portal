{% extends 'base.html' %}

{% block title %}Password Reset Complete - Student Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-success text-white text-center py-4">
                    <h3 class="mb-0">Password Reset Complete</h3>
                </div>
                <div class="card-body text-center p-4">
                    <i class="fas fa-check-circle text-success display-3 mb-3"></i>
                    <p class="mb-0">Your password has been set. You can now log in.</p>
                </div>
                <div class="card-footer bg-light text-center py-3">
                    <a href="{% url 'login' %}" class="btn btn-primary">Log In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
